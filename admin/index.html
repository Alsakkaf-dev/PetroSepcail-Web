<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صندوق الرسائل — إدارة | بتروسبيشل</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/img/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&family=Montserrat:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <main id="main" class="section bg-mesh" style="min-block-size: 100svh; padding-block-start: var(--sp-7);">
    <div class="container">
      <div style="display: flex; align-items: center; gap: var(--sp-3); margin-block-end: var(--sp-5); flex-wrap: wrap;">
        <a href="/" class="brand"><img src="/assets/img/logos/main-logo.png" alt="بتروسبيشل" width="204" height="68" style="block-size: 2.6rem; inline-size: auto;"></a>
        <h1 style="font-size: var(--fs-700);">صندوق رسائل الموقع</h1>
        <button class="btn btn--ghost btn--sm" id="btn-logout" style="margin-inline-start: auto; display: none;">تسجيل الخروج</button>
      </div>

      <!-- Login -->
      <div class="card" id="login-card" style="max-width: 26rem; margin-inline: auto;">
        <h2 style="font-size: var(--fs-600); margin-block-end: var(--sp-4); color: var(--blue);">دخول المدير</h2>
        <form id="login-form" novalidate>
          <div class="flow">
            <div class="field">
              <label for="ad-email">البريد الإلكتروني</label>
              <input id="ad-email" type="email" autocomplete="username" required dir="ltr">
            </div>
            <div class="field">
              <label for="ad-pass">كلمة المرور</label>
              <input id="ad-pass" type="password" autocomplete="current-password" required dir="ltr">
            </div>
            <button class="btn btn--gold" type="submit" style="inline-size: 100%;">دخول</button>
            <p class="small text-muted" id="login-err" role="alert" style="display: none; color: #b91c1c;">تعذر الدخول — تحقق من البريد وكلمة المرور.</p>
          </div>
        </form>
      </div>

      <!-- Inbox -->
      <div id="inbox" style="display: none;">
        <p class="small text-muted" style="margin-block-end: var(--sp-3);"><span id="msg-count">0</span> رسالة — غير المقروءة مظللة بالذهبي</p>
        <div class="table-scroll">
          <table class="admin-table">
            <thead>
              <tr><th>التاريخ</th><th>الاسم</th><th>التواصل</th><th>الرسالة</th><th>الحالة</th></tr>
            </thead>
            <tbody id="msg-rows"></tbody>
          </table>
        </div>
        <p class="small text-muted" id="inbox-empty" style="display: none; margin-block-start: var(--sp-3);">لا توجد رسائل بعد — عندما يرسل الزوار رسائل عبر نموذج التواصل ستظهر هنا.</p>
      </div>
    </div>
  </main>

  <script>
    /* Admin inbox — talks to our own message backend directly (no libraries). */
    (() => {
      "use strict";
      const URL_BASE = "https://zomiysojilmlbwyxrazj.supabase.co";
      const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpvbWl5c29qaWxtbGJ3eXhyYXpqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNzgyNzcsImV4cCI6MjA5OTk1NDI3N30.H_93bZv7gVPmwI-x1LF_5fV9KP6OnSRLLaaF4J53Yk0";
      const $ = s => document.querySelector(s);
      const token = () => sessionStorage.getItem("ps-admin-token");

      const show = authed => {
        $("#login-card").style.display = authed ? "none" : "";
        $("#inbox").style.display = authed ? "" : "none";
        $("#btn-logout").style.display = authed ? "" : "none";
      };

      const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      async function load() {
        const res = await fetch(`${URL_BASE}/rest/v1/contact_messages?select=*&order=created_at.desc`, {
          headers: { apikey: KEY, Authorization: `Bearer ${token()}` }
        });
        if (res.status === 401) { sessionStorage.removeItem("ps-admin-token"); show(false); return; }
        const rows = await res.json();
        $("#msg-count").textContent = rows.length;
        $("#inbox-empty").style.display = rows.length ? "none" : "";
        $("#msg-rows").innerHTML = rows.map(r => `
          <tr class="${r.status === "new" ? "is-unread" : ""}" data-id="${r.id}">
            <td class="ltr nowrap">${new Date(r.created_at).toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" })}</td>
            <td>${esc(r.name)}</td>
            <td><a class="ltr" href="mailto:${esc(r.email)}">${esc(r.email)}</a><br><a class="ltr nowrap" href="tel:${esc(r.phone)}">${esc(r.phone)}</a></td>
            <td class="msg-cell">${esc(r.message)}</td>
            <td>${r.status === "new"
              ? '<button class="btn btn--sm btn--gold" data-read>تحديد كمقروءة</button>'
              : '<span class="small text-muted">مقروءة</span>'}</td>
          </tr>`).join("");
      }

      document.addEventListener("click", async e => {
        const btn = e.target.closest("[data-read]");
        if (!btn) return;
        const id = btn.closest("tr").dataset.id;
        await fetch(`${URL_BASE}/rest/v1/contact_messages?id=eq.${id}`, {
          method: "PATCH",
          headers: { apikey: KEY, Authorization: `Bearer ${token()}`, "Content-Type": "application/json" },
          body: JSON.stringify({ status: "read" })
        });
        load();
      });

      $("#login-form").addEventListener("submit", async e => {
        e.preventDefault();
        $("#login-err").style.display = "none";
        const res = await fetch(`${URL_BASE}/auth/v1/token?grant_type=password`, {
          method: "POST",
          headers: { apikey: KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: $("#ad-email").value.trim(), password: $("#ad-pass").value })
        });
        if (!res.ok) { $("#login-err").style.display = ""; return; }
        const data = await res.json();
        sessionStorage.setItem("ps-admin-token", data.access_token);
        show(true); load();
      });

      $("#btn-logout").addEventListener("click", () => {
        sessionStorage.removeItem("ps-admin-token");
        show(false);
      });

      if (token()) { show(true); load(); } else { show(false); }
    })();
  </script>
</body>
</html>
