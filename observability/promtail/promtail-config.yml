# Docker-API service discovery (via the mounted socket) — streams container
# stdout/stderr directly, no /var/lib/docker/containers mount needed. Node
# services already emit one pino JSON object per line (packages/observability
# logger.ts), so Loki stores structured, PII-masked log lines as-is.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
