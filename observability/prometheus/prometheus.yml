# TC-PC10-004 (FR-PC10-002): scrapes app + DB metrics. Docker service-name
# hosts (api:4000 etc.) are internal DNS, stable across every tier — not a
# parity violation (same reasoning as parity-grep.mjs's own exemption note).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:4000"]

  - job_name: realtime
    static_configs:
      - targets: ["realtime:4001"]

  - job_name: zatca-sim
    static_configs:
      - targets: ["zatca-sim:4010"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
